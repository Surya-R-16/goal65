    <title>NutriVoice - AI Health Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Roboto Flex', 'sans-serif'],
            },
            colors: {
              // Material 3 inspired palette (Seed: Deep Purple)
              primary: {
                container: '#EADDFF',
                onContainer: '#21005D',
                DEFAULT: '#6750A4',
                text: '#FFFFFF',
              },
              secondary: {
                container: '#E8DEF8',
                onContainer: '#1D192B',
                DEFAULT: '#625B71',
              },
              tertiary: {
                container: '#FFD8E4',
                onContainer: '#31111D',
                DEFAULT: '#7D5260',
              },
              surface: {
                DEFAULT: '#FEF7FF',
                variant: '#E7E0EC',
                container: '#F3EDF7',
                bright: '#FFFFFF',
              },
              onSurface: {
                DEFAULT: '#1C1B1F',
                variant: '#49454F',
              },
              outline: '#79747E',
            },
            borderRadius: {
              '3xl': '28px',
              '4xl': '32px',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FEF7FF; /* M3 Surface */
        color: #1C1B1F;
        -webkit-tap-highlight-color: transparent;
      }
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* M3 Ripple effect utility */
      .ripple {
        position: relative;
        overflow: hidden;
        transform: translate3d(0, 0, 0);
      }
      .ripple:after {
        content: "";
        display: block;
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
        background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
        background-repeat: no-repeat;
        background-position: 50%;
        transform: scale(10, 10);
        opacity: 0;
        transition: transform .5s, opacity 1s;
      }
      .ripple:active:after {
        transform: scale(0, 0);
        opacity: 0.1;
        transition: 0s;
      }
    </style>
